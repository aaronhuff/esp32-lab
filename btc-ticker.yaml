substitutions:
  name: "esp32-c6-btc-ticker"
  friendly_name: "ESP32-C6 BTC Ticker"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 55%
      - light.turn_on:
          id: status_led
          red: 100%
          green: 18%
          blue: 0%
          brightness: 22%

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  id: wifi_component

# Sync real-world time & manage Night Mode schedule (11 PM - 7 AM)
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Toronto"
    on_time:
      # 11:00 PM (23:00): Night Mode Sleep (Screen & LED off)
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - light.turn_off: display_backlight
          - light.turn_off: status_led
          - logger.log: "Entering Night Mode (Sleep)"
      # 7:00 AM (07:00): Morning Wake Up
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - light.turn_on:
              id: display_backlight
              brightness: 55%
          - light.turn_on:
              id: status_led
              brightness: 22%
              red: 100%
              green: 18%
              blue: 0%
          - logger.log: "Exiting Night Mode (Wake)"

logger:
  level: INFO

# Wi-Fi Info Sensors for Display
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
    ssid:
      id: wifi_ssid_sensor

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "WiFi Signal"

# PWM Output for Display Backlight (Dimmable on GPIO 22)
output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

# Backlight Monochromatic Light Component (55% Daytime Brightness)
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

  # Addressable WS2812 RGB LED on GPIO 8
  - platform: esp32_rmt_led_strip
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    rgb_order: RGB
    name: "Onboard RGB"
    id: status_led
    default_transition_length: 500ms
    restore_mode: ALWAYS_ON

# Hardware SPI Bus for ST7789 Display
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

# Fonts loaded from local TTF files in esp32-lab/fonts/
font:
  - file: "fonts/OpenSans-Bold.ttf"
    id: font_large
    size: 34
  - file: "fonts/OpenSans-Bold.ttf"
    id: font_medium
    size: 18
  - file: "fonts/OpenSans-Regular.ttf"
    id: font_small
    size: 13

color:
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_orange
    red: 100%
    green: 60%
    blue: 0%
  - id: color_green
    red: 15%
    green: 88%
    blue: 25%
  - id: color_red
    red: 95%
    green: 20%
    blue: 20%
  - id: color_gray
    red: 45%
    green: 45%
    blue: 45%
  - id: color_light_gray
    red: 70%
    green: 70%
    blue: 70%
  - id: color_blue
    red: 25%
    green: 55%
    blue: 95%

# HTTP Request & JSON parsing
http_request:
  useragent: "ESPHome-ESP32C6/1.0"
  timeout: 10s

json:

globals:
  - id: btc_price
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: btc_24h_change
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: btc_updated_str
    type: std::string
    restore_value: no
    initial_value: '"Waiting..."'

# Fetch Bitcoin price every 45 seconds from CoinGecko
interval:
  - interval: 45s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"
                capture_response: true
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: 'return response->status_code == 200;'
                        then:
                          - lambda: |-
                              json::parse_json(body, [](JsonObject root) -> bool {
                                if (root["bitcoin"]["usd"]) {
                                  float price = root["bitcoin"]["usd"];
                                  float change = root["bitcoin"]["usd_24h_change"] | 0.0f;
                                  id(btc_price) = price;
                                  id(btc_24h_change) = change;
                                  id(btc_updated_str) = id(sntp_time).now().strftime("%H:%M:%S");

                                  // Only update LED if not in Night Mode (backlight is on)
                                  if (id(display_backlight).current_values.is_on()) {
                                    auto call = id(status_led).turn_on();
                                    call.set_brightness(0.22); // Calm, gentle desk glow
                                    if (change >= 0) {
                                      call.set_rgb(1.0, 0.18, 0.0); // Rich Bitcoin Amber-Orange
                                    } else {
                                      call.set_rgb(1.0, 0.0, 0.0);  // Pure Red when market is down
                                    }
                                    call.perform();
                                  }
                                  return true;
                                }
                                return false;
                              });
                        else:
                          - logger.log:
                              format: "HTTP request failed with status %d"
                              args: ['response->status_code']

# Physical BOOT button on GPIO 9 (Click: Wake screen if sleeping, or Next Page if awake)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Boot Button"
    on_click:
      then:
        - lambda: |-
            if (!id(display_backlight).current_values.is_on()) {
              // Wake up screen and LED
              auto bl_call = id(display_backlight).turn_on();
              bl_call.set_brightness(0.55);
              bl_call.perform();
              auto led_call = id(status_led).turn_on();
              led_call.perform();
            } else {
              // Cycle to next page
              id(disp).show_next_page();
            }

# Waveshare 1.47" ST7789 Display (172x320 landscape: 320x172)
display:
  - platform: st7789v
    model: "Waveshare 1.47in 172X320"
    id: disp
    cs_pin: GPIO14
    dc_pin: GPIO15
    reset_pin: GPIO21
    rotation: 90
    pages:
      # Page 1: BTC Ticker
      - id: page_btc
        lambda: |-
          // Header
          it.print(10, 8, id(font_medium), id(color_orange), "BITCOIN");
          if (id(sntp_time).now().is_valid()) {
            it.strftime(310, 8, id(font_medium), id(color_light_gray), TextAlign::TOP_RIGHT, "%H:%M", id(sntp_time).now());
          }

          // Top divider
          it.line(10, 32, 310, 32, id(color_gray));

          // Big Price Display
          if (id(btc_price) > 0) {
            char price_str[32];
            snprintf(price_str, sizeof(price_str), "$%.2f", id(btc_price));
            it.print(160, 42, id(font_large), id(color_white), TextAlign::TOP_CENTER, price_str);

            // 24h Change line
            char change_str[32];
            auto change_color = id(color_green);
            if (id(btc_24h_change) >= 0) {
              snprintf(change_str, sizeof(change_str), "+%.2f%% (24h)", id(btc_24h_change));
            } else {
              snprintf(change_str, sizeof(change_str), "%.2f%% (24h)", id(btc_24h_change));
              change_color = id(color_red);
            }
            it.print(160, 84, id(font_medium), change_color, TextAlign::TOP_CENTER, change_str);

            // Updated time
            char updated_buf[48];
            snprintf(updated_buf, sizeof(updated_buf), "Updated: %s", id(btc_updated_str).c_str());
            it.print(160, 112, id(font_small), id(color_light_gray), TextAlign::TOP_CENTER, updated_buf);
          } else {
            it.print(160, 60, id(font_medium), id(color_light_gray), TextAlign::TOP_CENTER, "Fetching Price...");
          }

          // Bottom divider
          it.line(10, 142, 310, 142, id(color_gray));

          // Footer
          it.print(10, 148, id(font_small), id(color_light_gray), "BTC / USD");
          it.print(310, 148, id(font_small), id(color_gray), TextAlign::TOP_RIGHT, "[BTN: Next Page]");

      # Page 2: System & Network Info
      - id: page_system
        lambda: |-
          // Header
          it.print(10, 8, id(font_medium), id(color_blue), "System Status");
          it.line(10, 32, 310, 32, id(color_gray));

          // Info rows
          it.print(10, 42, id(font_small), id(color_light_gray), "Board: Waveshare ESP32-C6 1.47\"");

          char ip_str[48];
          if (id(wifi_ip).has_state() && !id(wifi_ip).state.empty()) {
            snprintf(ip_str, sizeof(ip_str), "IP: %s", id(wifi_ip).state.c_str());
            it.print(10, 64, id(font_small), id(color_green), ip_str);

            char rssi_str[48];
            snprintf(rssi_str, sizeof(rssi_str), "Wi-Fi: %s (%.0f dBm)", id(wifi_ssid_sensor).state.c_str(), id(wifi_signal_dbm).state);
            it.print(10, 86, id(font_small), id(color_light_gray), rssi_str);
          } else {
            it.print(10, 64, id(font_small), id(color_red), "Wi-Fi: Connecting...");
          }

          it.print(10, 108, id(font_small), id(color_light_gray), "Firmware: ESPHome (ESP-IDF)");

          // Bottom divider
          it.line(10, 142, 310, 142, id(color_gray));
          it.print(10, 148, id(font_small), id(color_light_gray), "Page 2/2");
          it.print(310, 148, id(font_small), id(color_gray), TextAlign::TOP_RIGHT, "[BTN: Next Page]");
