[platformio]
default_envs = esp32-cyd
src_dir = src
include_dir = include

[env]
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=3
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

; Environment for "Cheap Yellow Display" (ESP32-2432S028R)
[env:esp32-cyd]
board = esp32dev
build_flags = 
    ${env.build_flags}
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
lib_deps = 
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43

; Environment for LilyGO T-Display-S3 (1.9" IPS)
[env:lilygo-t-display-s3]
board = esp32-s3-devkitc-1
build_flags = 
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
lib_deps = 
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.1.12
