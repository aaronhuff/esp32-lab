[platformio]
default_envs = esp32-oled
src_dir = src
include_dir = include

[env]
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=3
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4

; Default environment: Standard ESP32 with I2C SSD1306 OLED (128x64)
; Requires only 4 pins (VCC, GND, SDA: GPIO21, SCL: GPIO22)
[env:esp32-oled]
board = esp32dev
lib_deps = 
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

; Alternative: ESP32-S3 with 1.28" Round GC9A01 LCD (Robotic Eyeball)
[env:esp32s3-round-eye]
board = esp32-s3-devkitc-1
build_flags = 
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.1.12
